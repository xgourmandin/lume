name: "Lume – Build & Deploy"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for Workload Identity Federation (WIF) OIDC token exchange.
permissions:
  id-token: write
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Shared constants
# ─────────────────────────────────────────────────────────────────────────────
env:
  # ── Landing Zone values — set as GitHub repository-level variables ──────────
  # Settings → Secrets and variables → Actions → Variables
  #   WIF_PROVIDER      = projects/.../providers/github-actions
  #   CICD_SA_EMAIL     = sa-...-cicd@....iam.gserviceaccount.com
  #   IAC_STATE_BUCKET  = <product-id>-iac-state-<hex>
  WIF_PROVIDER:     ${{ vars.WIF_PROVIDER }}
  CICD_SA_EMAIL:    ${{ vars.CICD_SA_EMAIL }}
  IAC_STATE_BUCKET: ${{ vars.IAC_STATE_BUCKET }}

  # Pinned tool versions
  TF_VERSION: "1.14.8"

  # Immutable image tag — every commit on `main` produces a unique tag.
  IMAGE_TAG: ${{ github.sha }}

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ── 1. PLAN ─────────────────────────────────────────────────────────────────
  # Runs on every pull request.  No infrastructure changes are applied.
  # Both environments are planned in parallel so reviewers can spot drift.
  # Each job targets its GitHub Environment so env-level variables are resolved.
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    # Targets the matching GitHub Environment to load per-env variables:
    #   GCP_PROJECT_ID        — GCP project where resources live
    #   GCP_REGION            — GCP region (e.g. europe-west1)
    #   TF_OBSERVE_BUCKET     — GCS bucket the backend reads TF state from
    #   IAP_OAUTH2_CLIENT_ID  — OAuth2 client ID for Cloud Run IAP
    # GitHub Environment secret:
    #   IAP_OAUTH2_CLIENT_SECRET
    environment: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account:            ${{ env.CICD_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: iac/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.IAC_STATE_BUCKET }}"

      - name: Terraform Plan
        working-directory: iac/environments/${{ matrix.environment }}
        run: terraform plan

  # ── 2. BUILD ─────────────────────────────────────────────────────────────────
  # Runs once on every push to main.
  # Builds both Docker images and pushes them to Artifact Registry using the
  # immutable git-SHA tag (and `latest`). Both deploy jobs consume these images
  # without rebuilding, keeping the pipeline fast and the artefact identical
  # across environments.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build & push images"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate with GCP (WIF → CICD SA) ──────────────────────────────
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account:            ${{ env.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Docker: point at the Artifact Registry ─────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "$(echo '${{ vars.ARTIFACT_REGISTRY }}' | cut -d/ -f1)" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Build & push backend ────────────────────────────────────────────────
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          # Tag with both the immutable SHA and `latest` to keep Cloud Run happy
          # when no explicit image override is supplied to the module.
          tags: |
            ${{ vars.ARTIFACT_REGISTRY }}/backend:${{ env.IMAGE_TAG }}
            ${{ vars.ARTIFACT_REGISTRY }}/backend:latest
          cache-from: type=registry,ref=user/app:latest
          cache-to: type=inline

      # ── Build & push frontend ───────────────────────────────────────────────
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ vars.ARTIFACT_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ vars.ARTIFACT_REGISTRY }}/frontend:latest
          cache-from: type=registry,ref=user/app:latest
          cache-to: type=inline

  # ── 3. DEPLOY DEV ────────────────────────────────────────────────────────────
  # Runs after a successful build.
  # Applies Terraform in the dev environment (no approval gate).
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → dev"
    runs-on: ubuntu-latest
    needs: build

    # No protection rule on the `dev` GitHub Environment → auto-deploy.
    environment: dev

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate with GCP (WIF → CICD SA) ──────────────────────────────
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account:            ${{ env.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Terraform ───────────────────────────────────────────────────────────
      - name: Terraform Init
        working-directory: iac/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ env.IAC_STATE_BUCKET }}"

      - name: Terraform Apply
        working-directory: iac/environments/dev
        run: terraform apply -auto-approve

  # ── 4. DEPLOY PROD ───────────────────────────────────────────────────────────
  # Runs after a successful dev deploy.
  # Reuses the images already pushed by the `build` job — no rebuild needed.
  #
  # The `prod` GitHub Environment should be configured with:
  #   - Required reviewers (≥ 1) for a manual approval gate
  #   - Deployment branch rule: main only
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: "Deploy → prod"
    runs-on: ubuntu-latest
    needs: deploy-dev

    # `prod` GitHub Environment carries its own variables and secrets and
    # exposes the approval gate that blocks automation until a human approves.
    environment: prod

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate with GCP ───────────────────────────────────────────────
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account:            ${{ env.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ── Terraform ───────────────────────────────────────────────────────────
      - name: Terraform Init
        working-directory: iac/environments/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ env.IAC_STATE_BUCKET }}"

      - name: Terraform Apply
        working-directory: iac/environments/prod
        run: terraform apply -auto-approve

